name: Deploy Navdurga Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check npm environment
        run: |
          node --version
          npm --version
          npm config get prefix
          npm config get omit
          npm config get production
          echo "NODE_ENV=$NODE_ENV"
          pwd
          ls -la

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check installed dependencies
        run: |
          echo "===== ROOT ====="
          pwd
          ls -la

          echo "===== NODE_MODULES ====="
          ls -la node_modules || true

          echo "===== NODE_MODULES BIN ====="
          ls -la node_modules/.bin || true

          echo "===== NEXT PACKAGE ====="
          ls -la node_modules/next || true

          echo "===== NPM LIST NEXT ====="
          npm list next || true

          echo "===== NPM BIN PATH ====="
          npm bin || true

      - name: Build Next.js
        run: npm run build

      - name: Verify out folder
        run: |
          test -d out
          ls -la out

      - name: Deploy frontend to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./out/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            backend/**